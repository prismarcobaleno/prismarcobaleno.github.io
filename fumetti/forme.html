  <body class=body>
  
    <h1 class=h1 id="inizio">Forme</h1>
    
  <div class=forma> 
    <img
    src="forme/1.png"
    alt="" > 
        <details> <summary>1. Quale di queste forme è la migliore?</summary>
         <figcaption> L'immagine è composta da un riquadro in alto che contiene il titolo, e diverse figure sparse: un cerchio, un rettangolo, una stella, una freccia, e un triangolo. In basso a destra, il numero di pagina. </figcaption> 
        </details>
  </div> 
  <br>
  <div class=forma> 
      <img
      src="forme/2.png"
      alt="" > 
        <details> 
        <summary>2. Il triangolo, ovviamente, perché è il più vicino alla riga grigia.</summary>
         <figcaption> Il triangolo ora è evidenziato in grigio, e c'è una riga grigia alla sua destra. </figcaption> 
        </details>
  </div> 
  <br>  
  <div class=forma> 
      <img
      src="forme/3.png"
      alt="" > 
        <details> 
        <summary>3. È un fatto misurabile. Un'ovvietà.</summary>
         <figcaption> Tutte le figure ora sono numerate in base alla distanza dalla linea a destra, rappresentata con delle linee tratteggiate grigie. </figcaption> 
        </details>
  </div> 
  <br>
  <div class=forma> 
      <img
      src="forme/4.png"
      alt="" > 
        <details> 
        <summary>4. ...</summary>
         <figcaption> Appaiono delle chiazze verdi sui bordi della scatola rettangolare che contiene il titolo,
         composto da tre puntini, e sul tondino che contiene il numero di pagina.</figcaption> 
        </details>
  </div>  
  <br>
  <div class=forma> 
      <img
      src="forme/5.png"
      alt="" > 
        <details> 
        <summary>5. ...</summary>
         <figcaption> L'erba inizia a crescere sulla parte in basso, un rampicante si avvolge intorno alla sbiadita scatola del titolo, i numeri sulle figure e la linea grigia sbiadiscono.</figcaption> 
        </details>
  </div> 
  <br>
  <div class=forma> 
      <img
      src="forme/6.png"
      alt="" > 
        <details> 
        <summary>6. </summary>
         <figcaption> Il rampicante cresce ed i suoi rami verdi e marroni sono l'unica indicazione di dov'era la scatola del titolo. L'erba è cresciuta e copre il numero di pagina. Le forme sono ancora ben visibili.</figcaption> 
        </details>
  </div>  
  <br>
  <div class=forma> 
      <img
      src="forme/7.png"
      alt="" > 
        <details> 
        <summary>7. </summary>
         <figcaption> 
         <p>Una creatura grigia, con due tondi occhi neri e due braccia, si aggira per l'immagine come se ogni forma fosse il riquadro di un fumetto, a volte più piccola e a volte più grande.</p>
         <p>Si sporge dalla finestra rettangolare che era occupata dal titolo, come se avesse finito di arrampicarsi.</p>
         <p>Avvicina la testa per guardare attraverso il fumetto a forma di freccia, si arrotola in quello stellato, guarda giù tenendosi alle pareti del cerchio, si stiracchia appesa al lato superiore del rettangolo, si siede dentro al bordo del triangolo. Una creatura più grande tiene in mano una finestra pentagonale nuova, osservando la piccola creatura visibile all'interno.</p>
         <p>Il numero di pagina, 7, è una chiazza d'erba più chiara.</p>
         </figcaption> 
        </details>
  </div>
