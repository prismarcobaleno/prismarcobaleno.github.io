</p>

<script>
var avanza = 1;
const finestra = document.getElementById("fine");

var notif = 0
var anno = 20023
var miao = "!"
var conta

function con(a) { 
var conta = Math.floor((Math.random() * a));  
		if (conta == 1) { 
		return "!!"
		}
		else if (conta == 2) { 
		return "! <abbr title='emoji gatto'>:3</abbr>"
		}
		else if (conta == 3){
		return "!!!"
		} 
		else {return "!"}

}

function avanti() {


var miao = con(6)

let p1 = document.createElement("p");
		if (avanza == 0) {
		  p1.innerHTML = ("<hr><br><strong>ry:</strong> buon anno"+ miao + "<span class='gri'> [01/01/"+ anno +"]</span>");
		  avanza = 1 ;
			notif += 1 ; document.getElementById("note").innerHTML = notif;
			anno += 1;}
			

		else if (avanza == 1 ){
		  p1.innerHTML = ("<strong>ry:</strong> buon compleanno" + miao + "<span class='gri'> [25/02/"+ anno +"]</span>");
		  avanza = 0;
			notif += 1 ; document.getElementById("note").innerHTML = (notif);
			}

 document.getElementById("fine").appendChild(p1);
 finestra.scrollBy({ top: 1000, behavior: "smooth" });


}
