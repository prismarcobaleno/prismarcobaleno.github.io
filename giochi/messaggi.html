<h1>Messaggi non letti</h1> <div class="scatola">

<div class="scatolina fissa" id="fine">
<p> <span title="ry, [01/01/20023]"> > buon anno!</span></p>
</div>

</div>
<br>
<p class="bottoni"> 
<button id="bottone" onclick="avanti()">Ignora (<span id="note">0</span>)</button>
<button id="risp" disabled title="Non puoi rispondere." onclick="rispondi()">Rispondi</button>
</p>

<script>
var avanza = 1;
const finestra = document.getElementById("fine");

var notif = 0
var anno = 20023
var miao = "!"
var conta

function con(a) { 
var conta = Math.floor((Math.random() * a));  
		if (conta == 1) { 
		return "!!"
		}
		else if (conta == 2) { 
		return "! :3"
		}
		else if (conta == 3){
		return "!!!"
		} 
		else {return "!"}

}

function avanti() {


var miao = con(6)

let p1 = document.createElement("p");
		if (avanza == 0) {
		  p1.innerHTML = ("<hr><br> > <span title='ry, [01/01/"+ anno +"]'>buon anno"+ miao+ "</span>");
		  avanza = 1 ;
		finestra.scrollBy({ top: 1000, behavior: "smooth" });
			notif += 1 ; document.getElementById("note").innerHTML = notif;
			anno += 1;}
			

		else if (avanza == 1 ){
		  p1.innerHTML = ("> <span title='ry, [25/02/"+ anno +"]'>buon compleanno"+ miao +"</span>");
		  avanza = 0;
			notif += 1 ; document.getElementById("note").innerHTML = (notif);
		finestra.scrollBy({ top: 1000, behavior: "smooth" });

}
  document.getElementById("fine").appendChild(p1);
}
</script>
