    <h1 id="inizio" >Noia</h1>
    
    
    <div class=scatolina> 
     Trova la <b class=v>motivazione</b> per fare le cose che dovresti fare! 
    </div> 
    
    <div class=scatola>  
    <p>Ti serve una motivazione di 100 per alzarti.</p>
    <p> Sono le <b id="ore">12</b> e qualcosa, e la tua motivazione è a <b id="m">0</b>. Riprova tra qualche minuto?</p>  
  
      <noscript>(Se Javascript fosse attivato, il numero che indica la motivazione aumenterebbe di 1 ogni minuto. Però, ecco il trucco: in realtà è solo il numero dei minuti nell'orario. È impossibile vincere.) <br><br> </noscript>
  
     </div> 
     
    
    <script>
    
 
  const d = new Date(); document.getElementById("ore").innerHTML = d.getUTCHours();
  const m = new Date(); document.getElementById("m").innerHTML = m.getMinutes();
    
    </script>
