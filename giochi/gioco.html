<body>
<h1>Gioco</h1><div class="scatola">
<p> <button id="bottone" onclick="clic()">Cliccami.</button></p>
<p>Motivazione: <span id="motivazione">0</span></p>

<h2>Registro:</h2>
<div class="scatolina fissa" id="1">
</div>
</div>

<script>
var  mot = 0;
function clic() {let moti = Math.floor((Math.random() * 6) - 2);

var p1 = document.createElement("p");
  p1.innerHTML = ("Clic. " + moti + " motivazione.");
  document.getElementById("1").appendChild(p1);

 mot += moti
  document.getElementById("motivazione").innerHTML = mot;
}


</script>
